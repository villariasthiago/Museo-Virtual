<script>
window.addEventListener('DOMContentLoaded', function() {
  var $=function(s){return document.querySelector(s)};
  
  var PIEZAS=[
   {glb:'modelo1.glb',codigo:'GHUNLPam 28000',coleccion:'Paleontológica',lado:'izq',z:-4.5,size:0.62,spin:48,tilt:0,yaw:0},
   {glb:'modelo2.glb',codigo:'PVSJ 585',coleccion:'Ricardo',lado:'der',z:-4.5,size:0.72,spin:0,tilt:28,yaw:90},
   {glb:'modelo3.glb',codigo:'GHUNLPam 15375',coleccion:'Paleontológica',lado:'izq',z:-10,size:0.6,spin:48,tilt:0,yaw:0},
   {glb:'modelo4.glb',codigo:'GHUNLPam 29818',coleccion:'Ricardo',lado:'der',z:-10,size:0.72,spin:0,tilt:30,yaw:0},
   {glb:'modelo5.glb',codigo:'Avipeda 8643',coleccion:'Ricardo',lado:'centro',z:-16.4,size:0.95,spin:0,tilt:28,yaw:0}
  ];

  var SALA={ancho:7,fondo:-19,atras:3.2,alto:4.2,xPed:2.35};
  var scene=$('#scene');

  function buildSala(){
    var W=SALA.ancho,L=SALA.atras-SALA.fondo,cz=(SALA.atras+SALA.fondo)/2,H=SALA.alto;
    
    var floor=document.createElement('a-entity');
    floor.setAttribute('geometry','primitive: plane; width: '+W+'; height: '+L);
    floor.setAttribute('material','color: #2c2925; roughness: 0.92');
    floor.setAttribute('position','0 0 '+cz);
    floor.setAttribute('rotation','-90 0 0');
    scene.appendChild(floor);

    var light=document.createElement('a-entity');
    light.setAttribute('light','type: hemisphere; color: #cfe8e0; groundColor: #2a2118; intensity: 1.2');
    scene.appendChild(light);
  }

  function buildPiezas(){
    PIEZAS.forEach(function(p, i){
      var x = p.lado==='izq'?-SALA.xPed:p.lado==='der'?SALA.xPed:0;
      
      var pedestal = document.createElement('a-entity');
      pedestal.setAttribute('geometry','primitive: box; width: 0.7; height: 1; depth: 0.7');
      pedestal.setAttribute('material','color: #d9d3c5');
      pedestal.setAttribute('position', x+' 0.5 '+p.z);
      scene.appendChild(pedestal);

      var model = document.createElement('a-entity');
      model.setAttribute('gltf-model', 'url('+p.glb+')');
      model.setAttribute('position', x+' 1.1 '+p.z);
      model.setAttribute('scale', p.size+' '+p.size+' '+p.size);
      model.setAttribute('class', 'clickable');
      scene.appendChild(model);
    });
  }

  buildSala();
  buildPiezas();

  // Forzar la desactivación completa de la pantalla de carga al terminar
  setTimeout(function(){
    var loader = $('#loader');
    if(loader) {
      loader.style.display = 'none';
    }
  }, 1000);
});
</script>
